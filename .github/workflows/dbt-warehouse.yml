name: dbt warehouse equivalence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: finance_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres' --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      FINANCE_TEST_DATABASE_URL: postgresql://postgres:ci-disposable-only@localhost:5432/finance_test
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dbt.txt
      - run: pip install -r requirements-dbt.txt pytest
      - run: python -m pytest -q tests/test_dbt_warehouse.py
      - name: Exercise local warehouse adapter
        run: python -m mart.dbt_warehouse --adapter duckdb --output dist/dbt-duckdb
      - name: Exercise PostgreSQL warehouse adapter
        run: python -m mart.dbt_warehouse --adapter postgres --output dist/dbt-postgres
      - name: Reconcile both executed adapters
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          reports = [json.loads(Path(f'dist/dbt-{adapter}/evidence.json').read_text()) for adapter in ('duckdb', 'postgres')]
          assert reports[0]['reports'] == reports[1]['reports']
          assert reports[0]['metric_definition_changes'] == reports[1]['metric_definition_changes']
          for report in reports:
              assert report['checks'] and all(row['passed'] for row in report['checks'])
              for name, digest in report['source_files'].items():
                  assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          print('Executed adapters match row for row, including definition changes.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-warehouse-evidence
          path: |
            dist/dbt-duckdb/
            dist/dbt-postgres/
          if-no-files-found: error
          retention-days: 30
