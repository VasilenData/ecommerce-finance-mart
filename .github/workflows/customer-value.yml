name: customer-value-evidence
on:
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-value.txt
      - run: python -m pytest tests/test_customer_value.py -q
      - run: python -m mart.value_cli --download --output dist/customer-value
      - uses: actions/upload-artifact@v4
        with:
          name: customer-value-${{ github.sha }}
          path: dist/customer-value/
          retention-days: 30
