name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check .
      # The real-data test skips itself when data/ is absent.
      - run: python -m pytest -q
      - name: Build a reconciled subscription decision release
        run: python -m mart.subscriptions --output dist/subscriptions
      - uses: actions/upload-artifact@v4
        with:
          name: subscriptions-${{ github.sha }}
          path: dist/subscriptions/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests_js/*.test.mjs
