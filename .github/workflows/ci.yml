name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check .
      # The real-data test skips itself when data/ is absent.
      - run: python -m pytest -q
      - name: Reconcile actual Meterwork source bundles and reject invalid deliveries
        run: python -m mart.meterwork_bridge_exercise --output dist/meterwork-bridge
      - name: Observe receiver process death and verify exact recovery
        run: python -m mart.bridge_recovery --output dist/bridge-recovery
      - name: Fetch the source revision matching the immutable historical receipt
        run: git fetch --no-tags --depth=1 origin cbc8d335c84c914b702752834bfe8b2267913eaa
      - name: Verify published integration evidence
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          report = json.loads(Path('docs/meterwork-bridge/2026-11-15/evidence.json').read_bytes())
          assert report['check_count'] == 30 and all(row['passed'] for row in report['checks'])
          for name, digest in report['source_files_sha256'].items():
              # This receipt predates receiver hardening; preserve and verify its actual source.
              original = subprocess.check_output(['git', 'show', 'cbc8d335c84c914b702752834bfe8b2267913eaa:' + name])
              assert hashlib.sha256(original).hexdigest() == digest, name
          for name, digest in report['fixture_files_sha256'].items():
              path = Path('fixtures/meterwork-bridge/2026-11-15') / name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: meterwork-bridge-${{ github.sha }}
          path: |
            dist/meterwork-bridge/
            dist/bridge-recovery/
          if-no-files-found: error
          retention-days: 30
      - name: Build a reconciled subscription decision release
        run: python -m mart.subscriptions --output dist/subscriptions
      - uses: actions/upload-artifact@v4
        with:
          name: subscriptions-${{ github.sha }}
          path: dist/subscriptions/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests_js/*.test.mjs
