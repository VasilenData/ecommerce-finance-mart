name: full-build
# Manual run: downloads the UCI data, rebuilds DuckDB marts and the quality report, and runs full-data tests.
on: workflow_dispatch
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m mart.cli data
      - run: python -m mart.cli build
      - run: python -m pytest -q
