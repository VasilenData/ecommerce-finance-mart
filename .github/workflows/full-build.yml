name: full-build
# Manual release: rebuild and validate all downloadable artifacts from one source.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workbook calculation engine
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          # Fail on incomplete indexes; apt normally treats some DNS failures as warnings.
          if ! timeout 90s sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update; then
            echo "::warning::Runner package mirror failed; retrying official Ubuntu repositories."
            sudo python3 - <<'PY'
          from pathlib import Path
          replacements = {
              "mirror+file:/etc/apt/apt-mirrors.txt": "http://archive.ubuntu.com/ubuntu",
              "mirror+file:/etc/apt/apt-security-mirrors.txt": "http://security.ubuntu.com/ubuntu",
              "http://azure.archive.ubuntu.com/ubuntu": "http://archive.ubuntu.com/ubuntu",
              "https://azure.archive.ubuntu.com/ubuntu": "https://archive.ubuntu.com/ubuntu",
          }
          changed = False
          for source in (Path("/etc/apt/sources.list.d/ubuntu.sources"), Path("/etc/apt/sources.list")):
              if not source.is_file():
                  continue
              before = source.read_text()
              after = before
              for old, new in replacements.items():
                  after = after.replace(old, new)
              if after != before:
                  source.write_text(after)
                  changed = True
          if not changed:
              raise SystemExit("No recognized Ubuntu runner mirror to replace; refusing an unbounded retry.")
          PY
            timeout 90s sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          fi
          timeout 240s sudo apt-get "${apt_options[@]}" install -y --no-install-recommends libreoffice-calc
      - run: pip install -r requirements-dev.txt
      - run: python -m mart.cli data
      - run: python -m mart.cli build
      - run: python -m pytest -q
      - run: node --test tests_js/*.test.mjs
      - name: Build and validate workbook, explorer, charts and manifest together
        run: python -m mart.release --output dist/release --coverage-start 2009-12-01 --coverage-end 2011-12-09
      - uses: actions/upload-artifact@v4
        with:
          name: finance-mart-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
